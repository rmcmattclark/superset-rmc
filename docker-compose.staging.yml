#
# STAGING OVERRIDE
# Defines settings unique to the staging/testing environment.
#
services:
  superset:
    ports:
      - "8089:8088" # Map internal port 8088 to host port 8089

  superset-admin:
    build:
      context: .
      dockerfile: ./rmcdocker/Dockerfile
      target: lean
    container_name: superset_admin
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    env_file: ./rmcdocker/.env
    ports:
      - "8090:8088" # Admin access port
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - superset_home:/app/superset_home
      - ./freetds:/etc/freetds
      - ./rmcdocker/superset_config_admin.py:/app/pythonpath/superset_config.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    ports:
      - "5433:5432" # Staging database on port 5433 to avoid production conflict