#
# PRODUCTION OVERRIDE
# Defines settings unique to the production environment.
# Main container (8088): Azure AD SSO for end users
# Admin container (8090): Standard auth for administrators
#
services:
  redis:
    container_name: superset_cache_prod
    restart: unless-stopped

  db:
    container_name: superset_db_prod
    restart: unless-stopped

  superset:
    container_name: superset_app_prod
    ports:
      - "8088:8088"
    env_file:
      - ./rmcdocker/prod.env
    restart: unless-stopped

  superset-admin:
    build:
      context: .
      dockerfile: ./rmcdocker/Dockerfile
      target: lean
    container_name: superset_admin_prod
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    env_file: ./rmcdocker/prod.env
    ports:
      - "8090:8088"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - superset_home:/app/superset_home
      - ./freetds:/etc/freetds
      - ./rmcdocker/superset_config_admin.py:/app/pythonpath/superset_config.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  superset-worker:
    container_name: superset_worker_prod
    env_file:
      - ./rmcdocker/prod.env
    restart: unless-stopped

  superset-worker-beat:
    container_name: superset_worker_beat_prod
    env_file:
      - ./rmcdocker/prod.env
    restart: unless-stopped

volumes:
  db_data:
    external: true
    name: superset-rmc-prod_db_data
  superset_home:
    external: true
    name: superset-rmc-prod_superset_home
  redis_data:
    external: true
    name: superset-rmc-prod_redis_data
